spring.application.name=InternProject
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intern}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# free MySQL hosts allow only a few connections
spring.datasource.hikari.maximum-pool-size=5

app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://192.168.*:3000,http://10.*:3000,http://172.16.*:3000}
